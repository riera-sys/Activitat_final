<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Repàs JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="estils.css">
</head>
<body>

<h1>Repas de JavaScript</h1>

<nav>
    <a href="#variables">Variables</a>
    <a href="#condicionals">Condicionals</a>
    <a href="#funcions">Funcions</a>
    <a href="#dom">DOM</a>
    <a href="#events">Events</a>
</nav>

<section id="variables">
    <h2>Variables</h2>
    <p>Les variables guarden informacio.</p>
</section>

<section id="condicionals">
    <h2>Condicionals</h2>
    <button type="button" class="btn btn-primary" id="botoEdat">Comprovar edat</button>
    <p id="resultat"></p>
</section>

<section id="funcions">
    <h2>Funcions</h2>
    <input type="text" id="nomInput">
    <button type="button" class="btn btn-primary" id="botoSaludar">Saludar</button>
    <p id="salutacio"></p>
</section>

<section id="dom">
    <h2>DOM</h2>
    <p id="text">Text original</p>
    <button type="button" class="btn btn-primary" id="botoText">Canviar Text</button>
</section>

<section id="events">
    <h2>Events</h2>
    <button type="button" class="btn btn-primary" id="boto">Fes click</button>
    <p id="missatge"></p>
</section>

<script src="script.js"></script>

</body>
</html>
